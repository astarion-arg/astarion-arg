<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The Threshold - Level 1</title>
<style>
    body {
        background-color: #000;
        color: #fff;
        font-family: 'Courier New', monospace;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        text-align: center;
        transition: background-color 0.5s;
    }
    h1 {
        font-size: 2.5em;
        margin-bottom: 0.2em;
    }
    p {
        font-size: 1.2em;
        margin: 0.5em 0;
    }
    input {
        padding: 0.5em;
        font-size: 1em;
        border: none;
        border-radius: 4px;
        margin-top: 1em;
        text-align: center;
    }
    button {
        padding: 0.5em 1em;
        margin-top: 1em;
        font-size: 1em;
        border: none;
        border-radius: 4px;
        background-color: #444;
        color: #fff;
        cursor: pointer;
    }
    button:hover {
        background-color: #666;
    }
    #feedback {
        margin-top: 1em;
        font-style: italic;
        color: #f0f0f0;
    }
    .symbol {
        width: 150px;
        height: auto;
        margin-bottom: 0.5em;
    }
    #morse {
        margin-top: 1em;
        letter-spacing: 0.2em;
        font-weight: bold;
    }
    #congrats {
        display: none;
        font-size: 2em;
        color: #0f0;
    }
</style>
</head>
<body>
<img src="https://uploads.onecompiler.io/44c2s76jh/44c2s3aer/OIP.jpg" alt="Eye of Horus" class="symbol">
<h1>The Threshold</h1>
<p id="morse">-. --- -. / - ..- - - --- / -.-. .. --- .----. / -.-. .... . / ...- . -.. .. / .-..- / .-. . .- .-.. - .--.- .-.-.- / .- .-.. . - .... . .. .- / -....- .-</p>

<input type="text" id="key" placeholder="Enter key">
<button onclick="verify()">Submit</button>

<p id="feedback"></p>
<p id="congrats">טוּב מְאֹד! (Tov Me’od!)</p> <!-- Compliment in Aramaic: "Very Good!" -->

<script>
function verify() {
    const input = document.getElementById('key').value.trim().toUpperCase();
    const correctKey = "ALETHEIA";

    if(input === correctKey) {
        // Schermata di congratulazioni
        document.body.style.backgroundColor = "#000";
        document.getElementById('morse').style.display = "none";
        document.getElementById('key').style.display = "none";
        document.querySelector('button').style.display = "none";
        document.getElementById('feedback').style.display = "none";
        document.getElementById('congrats').style.display = "block";
    } else {
        document.getElementById('feedback').innerText = "The Eye is watching, but you are not ready yet.";
    }
}
</script>

</body>
</html>
